services:
  tasks:
    build: ./source
    image: tasks-md:${IMAGE_TAG:-local}
    container_name: tasks-md
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TASKS_DIR: /tasks
      CONFIG_DIR: /config
      TEAM_KEY: ${TEAM_KEY:?set TEAM_KEY}
      TITLE: ${TITLE:-Tasks.md}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      COOKIE_SECURE: "true"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/tasks:/tasks
      - ./data/config:/config
      - ./backups:/backups
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/_api/auth/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK}
