services:
  tasks.md:
    image: yhzhu99/tasks.md:${IMAGE_TAG:-latest}
    environment:
      TITLE: ${TITLE:-Tasks.md}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - tasks:/tasks
      - config:/config
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  tasks:
  config:
